steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/spoteye-monitor:$BUILD_ID', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spoteye-monitor:$BUILD_ID']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'spoteye-monitor'
    - '--image=gcr.io/$PROJECT_ID/spoteye-monitor:$BUILD_ID'
    - '--region=us-central1'
    - '--platform=managed'
    - '--allow-unauthenticated'
    - '--memory=1Gi'
    - '--cpu=1'
    - '--timeout=900'
    - '--max-instances=1'
    - '--min-instances=1'
    - '--cpu-throttling'
    - '--set-env-vars=SMTP_USER=${_SMTP_USER},RECIPIENT_EMAIL=${_RECIPIENT_EMAIL}'
    - '--set-secrets=SMTP_PASSWORD=spoteye-smtp-password:latest'

images:
  - 'gcr.io/$PROJECT_ID/spoteye-monitor:$BUILD_ID' 

substitutions:
  _SMTP_USER: ''
  _RECIPIENT_EMAIL: ''
